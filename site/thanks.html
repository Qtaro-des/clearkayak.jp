<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせありがとうございました | CLEAR KAYAK LAB</title>
  <meta
    name="description"
    content="CLEAR KAYAK LABへのお問い合わせありがとうございました。"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap"
  >

  <style>
    :root {
      --ground: #eef4f6;
      --surface: #ffffff;
      --line: #d3e0e4;
      --ink: #0e2830;
      --ink-mid: #0e2830;
      --accent: #00a6cf;
      --accent-deep: #0a6883;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ground);
      color: var(--ink-mid);
      font-family: "IBM Plex Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .thanks {
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: clamp(40px, 7vw, 80px);
    }

    .eyebrow {
      margin: 0 0 18px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 14px;
      letter-spacing: .25em;
      color: var(--accent-deep);
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 28px;
      font-family: Archivo, sans-serif;
      font-size: clamp(2.4rem, 7vw, 5rem);
      line-height: .95;
      letter-spacing: -.04em;
      color: var(--ink);
    }

    .jp {
      margin: 0 0 18px;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      font-weight: 700;
      color: var(--ink);
    }

    p {
      margin: 0;
      line-height: 1.9;
    }

    .back {
      display: inline-block;
      margin-top: 36px;
      padding: 14px 24px;
      border: 1px solid var(--ink);
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }

    .back:hover {
      background: var(--ink);
      color: #fff;
    }
  </style>
</head>

<body>
  <main class="thanks">
    <p class="eyebrow">CONTACT COMPLETE</p>
    <h1>THANK YOU</h1>

    <p class="jp">お問い合わせありがとうございました。</p>

    <p>
      お送りいただいた内容を確認のうえ、担当者よりご連絡いたします。<br>
      今しばらくお待ちください。
    </p>

    <a class="back" href="/">トップページへ戻る</a>
  </main>
</body>
</html>
